<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement App | Arithmetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <header class="top-nav">
    <a class="brand" href="index.html">
      <span class="brand-icon">∞</span>
      <span>Quantity Measurement</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Signup</a>
    </nav>
  </header>

  <main class="page-wrap centered">
    <section class="page-header reveal">
      <p class="eyebrow">Calculate</p>
      <h1>Arithmetic Operations</h1>
    </section>

    <section class="panel reveal">
      <form id="arithmetic-form" class="arithmetic-layout">
        <div class="measurement-section">
          <div class="field">
            <label>Measurement Type</label>
            <div class="measurement-type-selector vertical" id="arithTypeSelector">
              <div class="measurement-card" data-type="length"><span class="measurement-card-icon">↔</span>Length</div>
              <div class="measurement-card" data-type="volume"><span class="measurement-card-icon">📊</span>Volume</div>
              <div class="measurement-card" data-type="weight"><span class="measurement-card-icon">📦</span>Weight</div>
            </div>
            <input id="arithType" type="hidden" required />
          </div>
        </div>
        <div class="operations-section">
          <div class="form-grid">
            <div class="field">
              <label for="arithOperation">Operation</label>
              <select id="arithOperation" required>
                <option value="add">Add</option>
                <option value="subtract">Subtract</option>
                <option value="divide">Divide</option>
              </select>
            </div>
            <div class="field-pair">
              <div class="field">
                <label for="arithValue1">Value 1</label>
                <input id="arithValue1" type="number" step="any" required />
              </div>
              <div class="field">
                <label for="arithUnit1">Unit 1</label>
                <select id="arithUnit1" required></select>
              </div>
            </div>
            <div class="field-pair">
              <div class="field">
                <label for="arithValue2">Value 2</label>
                <input id="arithValue2" type="number" step="any" required />
              </div>
              <div class="field">
                <label for="arithUnit2">Unit 2</label>
                <select id="arithUnit2" required></select>
              </div>
            </div>
          </div>
          <div class="button-wrapper">
            <button class="btn primary" type="submit">Calculate</button>
          </div>
        </div>
      </form>
    </section>

    <section class="result-card reveal">
      <h3>Arithmetic Result</h3>
      <p id="arith-result" class="result-value muted">No calculation yet.</p>
      <p id="arith-message" class="muted"></p>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/arithmetic.js"></script>
</body>
</html>

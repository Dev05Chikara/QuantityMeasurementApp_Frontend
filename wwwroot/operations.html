<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement App | Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <header class="top-nav">
    <a class="brand" href="index.html">Quantity Measurement App</a>
    <nav class="nav-links">
      <a class="active" href="operations.html">Operations</a>
      <a href="history.html">History</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Signup</a>
    </nav>
  </header>

  <main class="page-wrap centered">
    <section class="page-header reveal">
      <p class="eyebrow">Choose Operation</p>
      <h1>What would you like to do?</h1>
    </section>

    <section class="card-grid reveal stagger">
      <article class="action-card">
        <h3>Convert</h3>
        <p>Convert any value to a different unit.</p>
        <a class="btn primary" href="convert.html">Convert</a>
      </article>
      <article class="action-card">
        <h3>Compare</h3>
        <p>Compare two quantities.</p>
        <a class="btn primary" href="compare.html">Compare</a>
      </article>
      <article class="action-card">
        <h3>Calculate</h3>
        <p>Add, subtract, or divide quantities.</p>
        <a class="btn primary" href="arithmetic.html">Calculate</a>
      </article>
    </section>
  </main>

  <script src="js/common.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement App | Compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <header class="top-nav">
    <a class="brand" href="index.html">
      <span class="brand-icon">∞</span>
      <span>Quantity Measurement</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
    </nav>
    <div class="user-profile" id="userProfile">
      <span class="user-icon">👤</span>
      <span class="username" id="usernameDisplay">Guest</span>
      <div class="profile-dropdown" id="profileDropdown">
        <a href="login.html" class="dropdown-item" id="loginOption">Login</a>
        <a href="signup.html" class="dropdown-item" id="signupOption">Signup</a>
        <a href="#" class="dropdown-item" id="logoutOption">Logout</a>
      </div>
    </div>
  </header>

  <main class="page-wrap centered">
    <section class="page-header reveal">
      <p class="eyebrow">Compare</p>
      <h1>Quantity Comparison</h1>
    </section>

    <section class="panel reveal">
      <form id="compare-form" class="compare-layout">
        <div class="measurement-section">
          <div class="field">
            <label>Measurement Type</label>
            <div class="measurement-type-selector vertical" id="compareTypeSelector">
              <div class="measurement-card" data-type="length"><span class="measurement-card-icon">↔</span>Length</div>
              <div class="measurement-card" data-type="volume"><span class="measurement-card-icon">📊</span>Volume</div>
              <div class="measurement-card" data-type="weight"><span class="measurement-card-icon">📦</span>Weight</div>
              <div class="measurement-card" data-type="temperature"><span class="measurement-card-icon">❄</span>Temperature</div>
            </div>
            <input id="compareType" type="hidden" required />
          </div>
        </div>
        <div class="operations-section">
          <div class="form-grid">
            <div class="field">
              <label for="value1">Value 1</label>
              <input id="value1" type="number" step="any" required />
            </div>
            <div class="field">
              <label for="unit1">Unit 1</label>
              <select id="unit1" required></select>
            </div>
            <div class="field">
              <label for="value2">Value 2</label>
              <input id="value2" type="number" step="any" required />
            </div>
            <div class="field">
              <label for="unit2">Unit 2</label>
              <select id="unit2" required></select>
            </div>
          </div>
          <div class="button-wrapper">
            <button class="btn primary" type="submit">Compare</button>
          </div>
        </div>
      </form>
    </section>

    <section class="result-card reveal">
      <h3>Comparison Result</h3>
      <p id="compare-result" class="result-value muted">No comparison yet.</p>
      <p id="compare-message" class="muted"></p>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/compare.js"></script>
</body>
</html>

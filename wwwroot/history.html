<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement App | History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <header class="top-nav">
    <a class="brand" href="index.html">
      <span class="brand-icon">∞</span>
      <span>Quantity Measurement</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a class="active" href="history.html">History</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Signup</a>
    </nav>
  </header>

  <main class="page-wrap centered">
    <section class="page-header reveal">
      <p class="eyebrow">History</p>
      <h1>Operation History</h1>
    </section>

    <section class="history-card reveal">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Operation</th>
              <th>Input</th>
              <th>Output</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
      <p id="history-message" class="muted"></p>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/history.js"></script>
</body>
</html>

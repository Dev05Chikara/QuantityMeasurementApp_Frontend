<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement App | Signup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <header class="top-nav">
    <a class="brand" href="index.html">
      <span class="brand-icon">∞</span>
      <span>Quantity Measurement</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
      <a href="login.html">Login</a>
      <a class="active" href="signup.html">Signup</a>
    </nav>
  </header>

  <main class="page-wrap auth-layout centered">
    <section class="auth-card reveal">
      <div style="text-align: center; font-size: 2.5rem; margin-bottom: 1.2rem;">👤</div>
      <p class="eyebrow">Authentication</p>
      <h1>Signup</h1>

      <form id="signup-form" class="form-grid">
        <div class="field">
          <label for="signupUsername">Username</label>
          <input id="signupUsername" type="text" required minlength="3" placeholder="Choose a username (min 3 chars)" />
        </div>
        <div class="field">
          <label for="signupPassword">Password</label>
          <input id="signupPassword" type="password" required minlength="6" placeholder="Minimum 6 characters" />
        </div>
        <div class="field">
          <label for="signupConfirmPassword">Confirm Password</label>
          <input id="signupConfirmPassword" type="password" required minlength="6" placeholder="Re-enter your password" />
        </div>
        <button class="btn primary" type="submit">Create Account</button>
      </form>

      <p id="signup-message" class="muted"></p>
      <p class="muted">Already registered? <a href="login.html">Go to login</a>.</p>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

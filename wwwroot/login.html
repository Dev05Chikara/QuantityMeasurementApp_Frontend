<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement App | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-layer"></div>
  <header class="top-nav">
    <a class="brand" href="index.html">
      <span class="brand-icon">∞</span>
      <span>Quantity Measurement</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
    </nav>
    <div class="user-profile" id="userProfile">
      <span class="user-icon">👤</span>
      <span class="username" id="usernameDisplay">Guest</span>
      <div class="profile-dropdown" id="profileDropdown">
        <a href="login.html" class="dropdown-item" id="loginOption">Login</a>
        <a href="signup.html" class="dropdown-item" id="signupOption">Signup</a>
        <a href="#" class="dropdown-item" id="logoutOption">Logout</a>
      </div>
    </div>
  </header>

  <main class="page-wrap auth-layout centered">
    <section class="auth-card reveal">
      <div style="text-align: center; font-size: 2.5rem; margin-bottom: 1.2rem;">🔐</div>
      <p class="eyebrow">Authentication</p>
      <h1>Login</h1>

      <form id="login-form" class="form-grid">
        <div class="field">
          <label for="loginUsername">Username</label>
          <input id="loginUsername" type="text" required placeholder="Enter your username" />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required minlength="6" placeholder="Minimum 6 characters" />
        </div>
        <button class="btn primary" type="submit">Login</button>
      </form>

      <p id="login-message" class="muted"></p>
      <p class="muted">No account? <a href="signup.html">Create one</a>.</p>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
